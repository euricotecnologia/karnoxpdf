[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/karnoxpdf", "apps/karnoxpdf-cli", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/euricotecnologia/karnoxpdf"

[workspace.dependencies]
# internal
karnoxpdf-geom = { path = "crates/geom", version = "1.0.0" }
karnoxpdf-filters = { path = "crates/filters", version = "1.0.0" }
karnoxpdf-cos = { path = "crates/cos", version = "1.0.0" }
karnoxpdf-crypt = { path = "crates/crypt", version = "1.0.0" }
karnoxpdf-organize = { path = "crates/organize", version = "1.0.0" }
karnoxpdf-measure = { path = "crates/measure", version = "1.0.0" }
karnoxpdf-annot = { path = "crates/annot", version = "1.0.0" }
karnoxpdf-fonts = { path = "crates/fonts", version = "1.0.0" }
karnoxpdf-model = { path = "crates/model", version = "1.0.0" }
karnoxpdf-content = { path = "crates/content", version = "1.0.0" }
karnoxpdf-redact = { path = "crates/redact", version = "1.0.0" }
karnoxpdf-print = { path = "crates/print", version = "1.0.0" }
karnoxpdf-xfdf = { path = "crates/xfdf", version = "1.0.0" }
karnoxpdf-sign = { path = "crates/sign", version = "1.0.0" }
karnoxpdf-optimize = { path = "crates/optimize", version = "1.0.0" }
karnoxpdf-a11y = { path = "crates/a11y", version = "1.0.0" }
karnoxpdf-ocr = { path = "crates/ocr", version = "1.0.0" }
karnoxpdf-js = { path = "crates/js", version = "1.0.0" }
karnoxpdf-compare = { path = "crates/compare", version = "1.0.0" }
karnoxpdf-preflight = { path = "crates/preflight", version = "1.0.0" }
karnoxpdf-export = { path = "crates/export", version = "1.0.0" }
karnoxpdf-edit = { path = "crates/edit", version = "1.0.0" }
karnoxpdf-create = { path = "crates/create", version = "1.0.0" }
karnoxpdf-forms = { path = "crates/forms", version = "1.0.0" }
karnoxpdf-xfa = { path = "crates/xfa", version = "1.0.0" }
karnoxpdf-render = { path = "crates/render", version = "1.0.0" }
karnoxpdf-engine = { path = "crates/engine", version = "1.0.0" }
karnoxpdf-ui-egui = { path = "crates/ui-egui", version = "1.0.0" }
karnoxpdf-automation = { path = "crates/automation", version = "1.0.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
