[package]
name = "karnoxpdf"
description = "KarnoxPDF desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
karnoxpdf-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
# Records from every crate go to standard error and the log file (src/logging.rs).
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click / Open With / Dock drops arrive as Apple events (#73); this small audited
# crate registers the handler (Objective-C interop needs unsafe, which our workspace forbids)
# behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[build-dependencies]
# Icon + VERSIONINFO for karnoxpdf.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"
