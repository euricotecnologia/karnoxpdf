[package]
name = "karnoxpdf-optimize"
description = "The PDF Optimizer: image downsampling and recompression, discarding objects, clean-up"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
karnoxpdf-cos = { workspace = true }
karnoxpdf-content = { workspace = true }
karnoxpdf-model = { workspace = true }
karnoxpdf-annot = { workspace = true }
thiserror.workspace = true
# JPEG decoding (zune-jpeg) and encoding, and bicubic resampling; already in the tree.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
karnoxpdf-render = { workspace = true }
