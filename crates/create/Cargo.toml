[package]
name = "karnoxpdf-create"
description = "Create PDFs: blank documents, images, text and Office documents"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
karnoxpdf-cos = { workspace = true }
karnoxpdf-model = { workspace = true }
karnoxpdf-fonts = { workspace = true }
png = "0.18"
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif"] }
thiserror = { workspace = true }
flate2 = { workspace = true }
roxmltree = "0.20"
crc32fast = "1.5"

[dev-dependencies]
karnoxpdf-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["bmp", "gif"] }
hayro-syntax = { workspace = true }
